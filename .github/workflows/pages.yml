name: Application verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared runtime dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript modules
        run: |
          node tests/test_backup.mjs
          node tests/test_workspace.mjs
